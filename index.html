<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rund ums Wohnen</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e4e7e4;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;color:#101411}
.app{width:min(430px,100vw);min-height:100vh;margin:auto;background:#fff;padding-bottom:84px}
.header{height:142px;position:relative;border-bottom:1px solid #f0f1f0;padding-top:17px}
.back{position:absolute;left:18px;top:28px;font-size:38px;font-weight:300;line-height:30px}
.avatar{position:absolute;left:50%;top:16px;transform:translateX(-50%);width:58px;height:58px;border-radius:50%;background:#f47b13;color:#fff;display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:800}
.name{text-align:center;font-size:28px;font-weight:800;padding-top:76px}
.small{font-size:13px;color:#737a75;text-align:center;margin-top:-1px}
main{padding:0 16px}
.heading{font-size:22px;font-weight:800;margin:16px 0 10px}
.search{height:48px;border:1px solid #cfd9d4;border-radius:13px;display:flex;align-items:center;padding:0 13px;gap:9px;box-shadow:0 1px 4px #0000000b}
.search .icon{font-size:29px;color:#34413a;line-height:1}
.search input{border:0;outline:0;font-size:17px;width:100%;font-family:inherit}
.site{width:100%;height:94px;margin:8px 0;padding:0;display:flex;text-align:left;overflow:hidden;border:1px solid #dfe4e0;border-radius:14px;background:#fff;color:#101411;font-family:inherit;cursor:pointer;box-shadow:0 1px 4px #0000000a;transition:.15s}
.site img{width:116px;height:94px;object-fit:cover;flex:none}
.site .mid{flex:1;min-width:0;padding:12px 9px}
.site h3{font-size:17px;margin:0 0 4px;line-height:1.15}
.site p{font-size:14px;color:#4d5650;margin:0;line-height:1.3}
.site .arrow{width:37px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#303a35}
.site.selected{background:#e9f5ff;border:2px solid #1688ee}
.site.selected .arrow{color:#1688ee;font-weight:700}
.activities{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.act{height:100px;border:1px solid #e0e4e1;border-radius:13px;background:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.act .ico{height:42px;display:flex;align-items:center;justify-content:center;font-size:28px}
.act.active{border:2px solid #4da5ef;background:#f4faff}
.start{width:100%;height:62px;margin-top:14px;border:0;border-radius:15px;background:#15b94e;color:#fff;font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 2px 7px #0002}
.start:disabled{background:#c0c6c2;box-shadow:none}
.running{display:none;margin-top:14px;padding:16px;border:1px solid #dfe4e0;border-radius:16px;text-align:center}
.timer{font-size:38px;font-weight:850;margin:5px}
.leave{width:100%;margin-top:10px;border:0;border-radius:14px;background:#111;color:#fff;padding:15px;font-size:17px;font-weight:800}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100vw);height:84px;background:#fff;border-top:1px solid #e1e5e2;display:grid;grid-template-columns:repeat(4,1fr);z-index:10}
.nav{border:0;background:#fff;font-family:inherit;font-size:13px;font-weight:650;color:#171b18}
.nav .ico{font-size:29px;height:34px;line-height:34px}
.nav.active{color:#087ee5}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#18201b;color:#fff;padding:11px 15px;border-radius:12px;font-size:14px;display:none;z-index:30;white-space:nowrap}
@media(min-width:600px){.app{margin:20px auto;border-radius:28px;overflow:hidden;min-height:900px}.bottom{border-radius:0 0 28px 28px}}
</style>
</head>

<div class="toast" id="toast"></div>

<script>
let selected='Heilein';
const sitesBox=document.getElementById('sites');
const search=document.getElementById('search');
const start=document.getElementById('start');
const cards=[...sitesBox.querySelectorAll('.site')];
function applyFilter(){
  const q=search.value.toLowerCase();
  cards.forEach(c=>c.style.display=c.innerText.toLowerCase().includes(q)?'flex':'none');
}
cards.forEach(card=>card.addEventListener('click',()=>{
  cards.forEach(c=>c.classList.remove('selected'));
  cards.forEach(c=>c.querySelector('.arrow').textContent='›');
  card.classList.add('selected');
  card.querySelector('.arrow').textContent='✓';
  selected=card.dataset.site;
  start.disabled=false;
}));
search.addEventListener('input',applyFilter);
start.disabled=false;
let startedAt=null,timerId=null;
start.addEventListener('click',()=>{
  if(!selected)return;
  startedAt=Date.now();
  document.getElementById('running').style.display='block';
  document.getElementById('runSite').textContent=selected;
  start.style.display='none';
  tick();
});
function tick(){
 const sec=Math.floor((Date.now()-startedAt)/1000);
 const h=String(Math.floor(sec/3600)).padStart(2,'0');
 const m=String(Math.floor(sec%3600/60)).padStart(2,'0');
 const s=String(sec%60).padStart(2,'0');
 document.getElementById('timer').textContent=`${h}:${m}:${s}`;
 timerId=setTimeout(tick,1000);
}
function leave(){
 clearTimeout(timerId);
 document.getElementById('runSite').textContent=selected+' · Baustelle verlassen';
}
document.querySelectorAll('.act').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('.act').forEach(x=>x.classList.remove('active'));
 b.classList.add('active');
}));
</script>
